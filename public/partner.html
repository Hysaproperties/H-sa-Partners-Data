<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hýsa Partner Page</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<style>.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}@media (max-width:820px){.grid2{grid-template-columns:1fr}}</style>
</head>
<body>
<div class="wide" style="max-width:1080px">
  <header class="site-h"><span class="mark">Hýsa · Partner page</span><h1 id="title">Loading…</h1><div id="status"></div></header>
  <main id="main" class="stack"></main>
  <footer class="site"><span>Questions? Email hysa@hysa.fo</span><a href="/">Guest guide</a></footer>
</div>
<script type="module">
import { fmtMoney as fmt, SYSTEMS } from "/assets/lib.js";
const $=s=>document.querySelector(s);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=location.hash.slice(1);let D=null;
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)};
const fdate=d=>d?new Date(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}):"—";
const how=s=>({shopify:"Online, via link",woocommerce:"Online, via link",script:"Online, via link",partner:"In person, you reported",guest:"In person, guest receipt",admin:"Registered by Hýsa"}[s.source]||"");
async function load(){
  if(!key){$("#title").textContent="Link not valid";$("#main").innerHTML='<div class="notice bad">Open this page with the link from your sign-up or welcome email.</div>';return}
  const r=await fetch(`/api/partner/${encodeURIComponent(key)}`);if(!r.ok){$("#title").textContent="Link not valid";$("#main").innerHTML='<div class="notice bad">This partner link is not valid. Contact hysa@hysa.fo.</div>';return}
  D=await r.json();render();
}
function snippet(){return `<!-- 1. On every page of your website, inside <head> -->
<script src="${D.origin}/t.js" data-partner="${D.partner.trackKey}"><\/script>

<!-- 2. On your order / booking confirmation page, below line 1.
     Replace the values with your system's order number and total excl. VAT. -->
<script>
  hysaConversion({ orderId: "ORDER-NUMBER", amount: 1234.00, currency: "DKK" });
<\/script>`}
function render(){
  const p=D.partner;$("#title").textContent=p.name;
  $("#status").innerHTML=p.status==="approved"?`<div class="row"><span class="chip ok">Approved partner</span><span class="chip money">You pay Hýsa ${esc(p.agreementLabel)}${(p.agreement?.type||"percent")==="percent"?" excl. VAT":""} + ${D.vatRate}% VAT</span><span class="chip">Invoiced ${D.deal?.frequency==="monthly"?"monthly":"weekly"}</span><span class="chip info" style="white-space:normal">Hýsa guests get: ${esc(D.deal?.guests||"")}</span></div>`:p.status==="rejected"?'<span class="chip bad">Not approved</span>':'<div class="notice warn">Your sign-up is waiting for approval. We will email you when you are live in the guest guide.</div>';
  const due=D.sales.filter(s=>s.status==="open"&&s.review!=="pending").reduce((a,s)=>a+(+s.commission||0),0);
  const it=p.integration||{};
  $("#main").innerHTML=`
  ${p.status==="approved"&&D.deal?.mode==="discount"?`<div class="notice ok stack" style="gap:4px"><b>Hýsa guests get ${esc(D.deal.rate)}% off with you</b><span>In person: check their Hýsa voucher below before they pay, give ${esc(D.deal.rate)}% off and register the amount they pay.${D.deal.code?` Online: create the discount code <b class="mono">${esc(D.deal.code)}</b> giving ${esc(D.deal.rate)}% off in your webshop.`:""} The discount is deducted from your Hýsa invoice, so you never pay more than ${esc(D.deal.pays)} in total.</span></div>`:""}
  ${p.status==="approved"&&D.deal?.mode==="cashback"?`<div class="notice ok stack" style="gap:4px"><b>Hýsa guests get cashback from Hýsa</b><span>Guests pay your normal price. Afterwards they send Hýsa a photo of the receipt and Hýsa pays them back. You do not need to do anything at the till. You can check the receipts below.</span></div>`:""}
  ${p.status==="approved"&&D.deal?.mode==="discount"?`<section class="panel" style="border:2px solid var(--accent)"><div class="panel-h"><h3>Redeem a Hýsa guest voucher</h3><span class="sm">Before the guest pays</span></div><div class="panel-b">
    <form id="vCheck" class="row" style="align-items:flex-end"><label class="f" style="flex:1;min-width:180px">Voucher code<input id="vCode" class="mono" placeholder="HY-XXXXX" autocomplete="off" style="font-size:1.2rem;text-transform:uppercase"></label><button class="btn pri lg">Check</button></form>
    <div id="vResult" style="margin-top:14px"></div></div></section>`:""}
  ${(D.todo||[]).length?`<div class="notice warn stack" style="gap:6px"><b>To do for your Hýsa partnership</b><ul style="margin:0;padding-left:18px">${D.todo.map(t=>`<li>${esc(t)}</li>`).join("")}</ul><span class="sm">Most of these you fix in “Your listing” or “Online bookings” below. Questions: hysa@hysa.fo</span></div>`:""}
  <div class="kpis">
    <div class="kpi"><span class="eyebrow">Guests sent to you</span><span class="v">${D.clicks.last30}</span><span class="d">clicks on your link, last 30 days (${D.clicks.total} in total)</span></div>
    <div class="kpi"><span class="eyebrow">Purchases by Hýsa guests</span><span class="v">${D.sales.length}</span><span class="d">${fmt(D.sales.reduce((a,s)=>a+(+s.amount||0),0))} in sales</span></div>
    <div class="kpi money"><span class="eyebrow">Commission this month</span><span class="v">${fmt(due)}</span><span class="d">excl. VAT, on next invoice</span></div>
    <div class="kpi"><span class="eyebrow">Invoices</span><span class="v">${D.invoices.length}</span><span class="d">${D.invoices.filter(i=>i.status!=="paid").length} unpaid</span></div>
  </div>
  <div class="grid2">
    <section class="panel"><div class="panel-h"><h3>Register an in-person purchase</h3></div><div class="panel-b">
      ${p.status!=="approved"?'<p class="muted" style="margin:0">Available once you are approved.</p>':`
      <form id="saleForm" class="form">
        <label class="f">Date<input id="sDate" type="date" value="${new Date().toISOString().slice(0,10)}" required></label>
        <label class="f">Amount paid incl. VAT (${esc(p.currency||"DKK")})<input id="sAmount" type="number" step="0.01" min="0" inputmode="decimal" required></label>
        <label class="f">Receipt no.<input id="sRef"></label>
        <label class="f">Persons<input id="sPersons" type="number" min="1" value="1"></label>
        <label class="f full">Guest name <span class="hint">if known</span><input id="sGuest"></label>
        <div class="full"><button class="btn pri">Register purchase</button></div>
      </form>`}
    </div></section>
    <section class="panel"><div class="panel-h"><h3>Online bookings</h3>${it.type==="shopify"||it.type==="woocommerce"?(it.lastError?'<span class="chip bad">Connection problem</span>':it.connected?'<span class="chip ok">Connected</span>':'<span class="chip warn">Not connected</span>'):""}</div><div class="panel-b stack">
      <label class="f">Your booking system<select id="iType">${Object.entries(SYSTEMS).map(([k,v])=>`<option value="${k}" ${it.type===k?"selected":""}>${esc(v)}</option>`).join("")}</select></label>
      <div id="iBox"></div>
      ${it.lastError?`<div class="notice bad">Last check failed: ${esc(it.lastError)}</div>`:it.lastSync?`<div class="sm">Last checked ${new Date(it.lastSync).toLocaleString("en-GB")}</div>`:""}
    </div></section>
  </div>
  ${(()=>{const rs=D.sales.filter(s=>s.source==="guest"&&s.review==="pending");if(!rs.length)return "";const days=D.deal?.reviewDays||3;
    return `<section class="panel" style="border:2px solid var(--warn)"><div class="panel-h"><h3>Guest receipts to check</h3><span class="sm">Approved automatically after ${days} days</span></div><div class="panel-b stack" style="gap:12px">
    <p class="sm" style="margin:0">A Hýsa guest sent us a receipt from you. Check it. If it is wrong (not your receipt, wrong amount, not a Hýsa guest), tell us before the date shown.</p>
    ${rs.map(s=>`<div class="row" style="justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:10px"><div><b>${fmt(s.amount,s.currency)}</b> · ${fdate(s.date)} · ${esc(s.guestName||"Guest")}<div class="sm">Check before ${fdate(new Date(new Date(s.createdAt).getTime()+days*864e5).toISOString())}</div></div>
      <div class="row">${s.guestReceiptId?`<a class="btn sm" target="_blank" rel="noopener" href="/api/partner/${encodeURIComponent(key)}/file/${encodeURIComponent(s.guestReceiptId)}">See receipt</a>`:""}<button class="btn sm pri" data-rok="${s.id}">Correct</button><button class="btn sm" data-rdis="${s.id}">Not correct</button></div></div>`).join("")}
    </div></section>`})()}
  <section class="panel"><div class="panel-h"><h3>Purchases by Hýsa guests</h3></div>
    ${D.sales.length?`<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>How</th><th>Order / receipt</th><th>Guest</th><th class="num">Amount</th><th class="num">Commission <span class="sm">(of amount excl. VAT)</span></th><th>Status</th></tr></thead><tbody>
    ${D.sales.map(s=>`<tr><td class="mono">${fdate(s.date)}</td><td>${how(s)}${s.guestConfirmed&&s.partnerReported?' <span class="chip ok">Receipt</span>':""}</td><td class="mono">${esc(s.orderRef||"—")}</td><td>${esc(s.guestName||"—")}</td><td class="num">${fmt(s.amount,s.currency)}${s.vatIncluded?'<div class="sm">incl. VAT</div>':s.amountExVat!=null?'<div class="sm">excl. VAT</div>':""}</td><td class="num">${fmt(s.commission,s.currency)}</td><td>${s.review==="disputed"?'<span class="chip bad">You disputed it</span>':s.review==="pending"?'<span class="chip warn">Please check</span>':s.status==="paid"?'<span class="chip ok">Paid</span>':s.status==="invoiced"?'<span class="chip info">Invoiced</span>':'<span class="chip">Next invoice</span>'}</td></tr>`).join("")}
    </tbody></table></div>`:'<div class="empty">No purchases yet.</div>'}
  </section>
  <section class="panel"><div class="panel-h"><h3>Invoices</h3></div>
    ${D.invoices.length?`<div class="tbl-wrap"><table><thead><tr><th>No.</th><th>Period</th><th>Due</th><th class="num">Total incl. VAT</th><th>Status</th></tr></thead><tbody>
    ${D.invoices.map(i=>`<tr><td class="mono">${esc(i.number)}</td><td>${esc(i.from)} – ${esc(i.to)}</td><td>${fdate(i.dueDate)}</td><td class="num">${fmt(i.total,i.currency)}</td><td>${i.status==="paid"?'<span class="chip ok">Paid</span>':'<span class="chip info">Awaiting payment</span>'}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">Invoices appear here. They are emailed to you once a month.</div>'}
  </section>
  <section class="panel"><div class="panel-h"><h3>Your listing in the guest guide</h3></div><div class="panel-b">
    <form id="infoForm" class="form">
      <label class="f full">Website<input id="website" value="${esc(p.website)}"></label>
      <label class="f">Phone<input id="phone" value="${esc(p.phone)}"></label>
      <label class="f">Email for guests<input id="publicEmail" value="${esc(p.email)}"></label>
      <label class="f">Address<input id="address" value="${esc(p.address)}"></label>
      <label class="f">Opening hours<input id="hours" value="${esc(p.hours)}"></label>
      <label class="f full">Description (English)<textarea id="description">${esc(p.description)}</textarea></label>

      <label class="f">Invoice email<input id="invoiceEmail" value="${esc(p.invoiceEmail)}"></label>
      <div class="full"><button class="btn">Save listing</button></div>
    </form></div></section>`;
  renderIntegration();
}
function snippetShop(){return `<!-- Add to every page, inside <head> -->
<script src="${D.origin}/t.js" data-partner="${D.partner.trackKey}"><\/script>`}
const rememberBox=t=>`<div class="stack" style="gap:8px;margin-top:6px"><b style="font-size:.92rem">Recommended: remember guests who come back later</b><p class="sm" style="margin:0">${t==="shopify"?"Shopify admin → Online Store → Themes → ⋯ → Edit code → <b>theme.liquid</b>. Paste this line just before <b>&lt;/head&gt;</b> and save.":"WordPress: paste this line into the site header, for example with the free plugin \"WPCode\" (Header section)."} Guests who click your Hýsa link and book later on the same device are then counted too.</p><pre class="code">${esc(snippetShop())}</pre><div><button class="btn sm" data-copy-shop>Copy code</button></div></div>`;
function renderIntegration(){
  const t=$("#iType").value,it=D.partner.integration||{};
  $("#iBox").innerHTML=t==="shopify"?`<form id="iForm" class="form"><label class="f">Shop address<input id="iShop" class="mono" value="${esc(it.shop)}" placeholder="yourshop.myshopify.com"></label><label class="f">Admin API access token<input id="iToken" class="mono" placeholder="${it.connected?"Saved. Paste a new one to replace":"shpat_…"}" autocomplete="off"></label><p class="sm full" style="margin:0">Shopify admin → Settings → Apps and sales channels → Develop apps → Create app "Hýsa" → Admin API scope <b>read_orders</b> → Install → copy the token.</p><div class="full"><button class="btn pri">Save connection</button></div></form>${rememberBox("shopify")}`
  :t==="woocommerce"?`<form id="iForm" class="form"><label class="f full">Shop URL<input id="iUrl" class="mono" value="${esc(it.url)}" placeholder="https://yourshop.fo"></label><label class="f">Consumer key<input id="iKey" class="mono" placeholder="${it.connected?"Saved":"ck_…"}" autocomplete="off"></label><label class="f">Consumer secret<input id="iSecret" class="mono" placeholder="${it.connected?"Saved":"cs_…"}" autocomplete="off"></label><p class="sm full" style="margin:0">WooCommerce → Settings → Advanced → REST API → Add key, permission <b>Read</b>. Keep Order attribution switched on.</p><div class="full"><button class="btn pri">Save connection</button></div></form>${rememberBox("woocommerce")}`
  :t==="script"?`<p class="sm" style="margin:0">Give this to your web developer. It only reports bookings from guests who came through your Hýsa link in the last ${D.cookieDays} days.</p><pre class="code" id="snip">${esc(snippet())}</pre><div class="row"><button class="btn sm" data-copy-snip>Copy code</button><button class="btn sm pri" data-save-type="script">Use this method</button></div>`
  :`<p class="sm" style="margin:0">Register in-person purchases with the form on this page.</p>${it.type!=="none"?'<button class="btn sm pri" data-save-type="none">Use this method</button>':""}`;
}
async function post(path,data){const r=await fetch(`/api/partner/${encodeURIComponent(key)}${path}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Could not save");return j}
document.addEventListener("change",e=>{if(e.target.id==="iType")renderIntegration()});
document.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;
  if(b.hasAttribute("data-copy-shop")){try{await navigator.clipboard.writeText(snippetShop());toast("Code copied")}catch(_){toast("Select the code and copy it")}}
  if(b.hasAttribute("data-copy-snip")){try{await navigator.clipboard.writeText(snippet());toast("Code copied")}catch(_){toast("Select the code and copy it")}}
  if(b.dataset.rok){try{await post("/receipt-ok",{saleId:b.dataset.rok});toast("Thank you. Confirmed.");load()}catch(err){toast(err.message)}return}
  if(b.dataset.rdis){const reason=prompt("What is wrong with this receipt? (e.g. not our receipt, wrong amount, not a Hýsa guest)");if(!reason)return;try{await post("/dispute",{saleId:b.dataset.rdis,reason});toast("Sent to Hýsa. We will look at it.");load()}catch(err){toast(err.message)}return}
  if(b.dataset.saveType){try{await post("/update",{integration:{type:b.dataset.saveType}});toast("Saved");load()}catch(err){toast(err.message)}}});
document.addEventListener("submit",async e=>{e.preventDefault();const f=e.target,v=id=>(f.querySelector("#"+id)?.value||"").trim();const btn=f.querySelector("button");btn.disabled=true;
  try{
    if(f.id==="vCheck"){let code=v("vCode").toUpperCase().replace(/\s+/g,"");if(/^HY[A-Z0-9]{5}$/.test(code))code="HY-"+code.slice(2);
      const r=await fetch(`/api/partner/${encodeURIComponent(key)}/voucher/${encodeURIComponent(code)}`);const j=await r.json().catch(()=>({ok:false,reason:"Not a valid code."}));
      $("#vResult").innerHTML=!j.ok?`<div class="notice bad"><b>Not valid.</b> ${esc(j.reason||"Check the code.")} Do not give the Hýsa offer.</div>`:`
        <div class="notice ok" style="font-size:1rem"><b>Valid voucher for ${esc(j.guestName)}.</b> Give the guest: <b>${esc(j.offer||"the Hýsa offer")}</b>${j.usedBefore?` <span class="sm">(used ${j.usedBefore} time(s) before)</span>`:""}</div>
        <form id="vRedeem" class="form" data-code="${esc(code)}" style="margin-top:12px"><label class="f">Amount the guest pays${D.deal?.mode==="discount"?` after the ${esc(D.deal.rate)}% discount`:""}, incl. VAT (${esc(D.partner.currency||"DKK")})<input id="vAmount" type="number" step="0.01" min="0" inputmode="decimal" required></label><label class="f">Receipt no. <span class="hint">optional</span><input id="vRef"></label><div class="full"><button class="btn pri lg">Register purchase</button></div></form>`;
      $("#vAmount")?.focus();return}
    if(f.id==="vRedeem"){const j=await post("/redeem",{code:f.dataset.code,amount:+v("vAmount"),orderRef:v("vRef")});$("#vResult").innerHTML=`<div class="notice ok"><b>Registered.</b> Thank you. The purchase by ${esc(j.guestName)} is saved.</div>`;$("#vCode").value="";setTimeout(load,1500);return}
    if(f.id==="saleForm"){const j=await post("/sale",{date:v("sDate"),amount:+v("sAmount"),orderRef:v("sRef"),persons:+v("sPersons")||1,guestName:v("sGuest")});toast(j.matchedGuestReceipt?"Registered and matched with the guest's receipt":"Purchase registered");await load();return}
    if(f.id==="iForm"){await post("/update",{integration:{type:$("#iType").value,shop:v("iShop"),token:v("iToken"),url:v("iUrl"),key:v("iKey"),secret:v("iSecret")}});toast("Connection saved. We check for orders every hour.");await load();return}
    if(f.id==="infoForm"){await post("/update",{website:v("website"),phone:v("phone"),publicEmail:v("publicEmail"),address:v("address"),hours:v("hours"),description:v("description"),invoiceEmail:v("invoiceEmail")});toast("Listing saved");await load();return}
  }catch(err){toast(err.message)}finally{btn.disabled=false}});
load();
</script>
</body>
</html>
