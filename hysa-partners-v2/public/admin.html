<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Hýsa Partner Referrals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<style>
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}.brand h1 span{color:var(--accent)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:600 .92rem var(--f-body);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.badge{background:var(--warn);color:var(--surface);border-radius:999px;font-size:.7rem;padding:0 6px;line-height:1.5}
main.admin{max-width:1240px;margin:0 auto;padding-block:22px 60px;padding-inline:16px;display:flex;flex-direction:column;gap:20px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.search{max-width:280px}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:var(--accent)}
.drawer-bg{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(700px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column}
.drawer-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}
.drawer-b{padding:16px;display:flex;flex-direction:column;gap:16px;padding-bottom:40px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:.9rem}.dl>span:nth-child(odd){color:var(--muted)}.dl>span{overflow-wrap:anywhere}
.lock{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.lock .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.log{font:12px/1.6 var(--f-mono);color:var(--muted);max-height:180px;overflow:auto;white-space:pre-wrap}
.receipt-img{max-width:100%;border-radius:6px;border:1px solid var(--line)}
@media print{body *{visibility:hidden}.print-area,.print-area *{visibility:visible}.print-area{position:absolute;inset:0;padding:24px;background:#fff;color:#000}.no-print{display:none!important}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="drawerRoot"></div>
<script type="module">
import * as L from "/assets/lib.js";
const API=window.HYSA_API||"";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=L.fmtMoney;
const fdate=d=>{if(!d)return"—";const x=new Date(d);return isNaN(x)?esc(d):x.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})};
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)};
async function copy(text,label="Copied"){try{await navigator.clipboard.writeText(text);toast(label)}catch(e){toast("Select the text and copy it manually")}}
function download(name,text,type="text/csv"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

const S={data:null,snap:new Map(),tab:"overview",q:{partners:"",sales:""},sf:{partner:"",status:"",how:""},inv:{partner:"",from:"",to:""},saving:null};
try{S.tab=sessionStorage.getItem("hysa-tab")||"overview"}catch(e){}
const live=a=>(a||[]).filter(x=>!x.deleted);
const P=()=>live(S.data.partners),SA=()=>live(S.data.sales),IV=()=>live(S.data.invoices);
const byId=(arr,id)=>arr.find(x=>x.id===id);
const touch=o=>{o.updatedAt=L.nowISO();return o};

/* ---------- api ---------- */
async function api(path,opt={}){const r=await fetch(API+path,{credentials:"include",headers:{"Content-Type":"application/json"},...opt});const j=await r.json().catch(()=>({}));if(r.status===401){renderLogin();throw new Error("Please log in")}if(!r.ok)throw new Error(j.error||"Request failed");return j}
function snapshot(){S.snap.clear();for(const [k,arr] of [["partner",S.data.partners],["sale",S.data.sales],["invoice",S.data.invoices]])for(const d of arr||[])S.snap.set(k+":"+d.id,JSON.stringify(d));S.snap.set("settings:main",JSON.stringify(S.data.settings))}
async function load(){S.data=await api("/api/admin/data");snapshot();renderShell()}
let saveTimer,saveQ=Promise.resolve();
function commit(){render();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveQ=saveQ.then(doSave)},300)}
async function doSave(){
  const docs=[];
  for(const [k,arr] of [["partner",S.data.partners],["sale",S.data.sales],["invoice",S.data.invoices]])for(const d of arr){const j=JSON.stringify(d);if(S.snap.get(k+":"+d.id)!==j)docs.push({kind:k,doc:d})}
  const sj=JSON.stringify(S.data.settings);if(S.snap.get("settings:main")!==sj)docs.push({kind:"settings",doc:S.data.settings});
  if(!docs.length)return;
  setSaving("Saving…");
  try{await api("/api/admin/upsert",{method:"POST",body:JSON.stringify({docs})});for(const d of docs)S.snap.set(d.kind+":"+d.doc.id,JSON.stringify(d.doc));setSaving("All changes saved","ok")}
  catch(e){setSaving("Not saved: "+e.message,"bad")}
}
function setSaving(msg,kind=""){S.saving={msg,kind};const el=$("#saveState");if(el)el.innerHTML=savingHTML()}
const savingHTML=()=>S.saving?`<span class="chip ${S.saving.kind}">${esc(S.saving.msg)}</span>`:"";

/* ---------- login ---------- */
function renderLogin(){
  $("#drawerRoot").innerHTML="";
  $("#app").innerHTML=`<div class="lock"><div class="card"><div><div class="eyebrow">Hýsa</div><h2>Partner Referrals</h2></div>
  <form id="loginForm" class="stack" style="gap:12px"><label class="f">Password<input id="pw" type="password" autocomplete="current-password" required autofocus></label><div id="lockErr"></div><button class="btn pri" type="submit">Log in</button></form></div></div>`;
  $("#loginForm").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button");b.disabled=true;
    try{const r=await fetch(API+"/api/admin/login",{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#pw").value})});if(!r.ok)throw 0;await load()}
    catch(_){$("#lockErr").innerHTML='<div class="notice bad">Wrong password.</div>';b.disabled=false}};
}

/* ---------- shell ---------- */
const TABS=[["overview","Overview"],["partners","Partners"],["sales","Sales"],["invoicing","Invoices"],["settings","Settings"]];
function renderShell(){
  $("#app").innerHTML=`<header class="top no-print"><div class="top-in">
    <div class="brand"><h1>Hýsa <span>Partner Referrals</span></h1><div class="row"><span id="saveState">${savingHTML()}</span><a class="btn sm" href="/" target="_blank" rel="noopener">Guest guide</a><button class="btn sm" data-act="reload">Reload</button><button class="btn sm" data-act="logout">Log out</button></div></div>
    <nav class="tabs" id="tabs"></nav></div></header><main class="admin" id="main"></main>`;
  render();
}
function render(){
  const m=$("#main");if(!m)return;
  const pend=P().filter(p=>p.status==="pending").length,rev=SA().filter(s=>s.review==="pending").length;
  $("#tabs").innerHTML=TABS.map(([k,v])=>`<button data-tab="${k}" aria-selected="${S.tab===k}">${v}${k==="partners"&&pend?`<span class="badge">${pend}</span>`:""}${k==="sales"&&rev?`<span class="badge">${rev}</span>`:""}</button>`).join("");
  const f=document.activeElement?.id,pos=f&&document.activeElement.selectionStart;
  m.innerHTML=({overview:vOverview,partners:vPartners,sales:vSales,invoicing:vInvoicing,settings:vSettings}[S.tab])();
  if(f){const el=document.getElementById(f);if(el&&m.contains(el)){el.focus();try{el.setSelectionRange(pos,pos)}catch(e){}}}
}
const statusChip=s=>s.review==="pending"?'<span class="chip warn">Needs approval</span>':s.review==="rejected"?'<span class="chip bad">Rejected</span>':s.status==="paid"?'<span class="chip ok">Paid</span>':s.status==="invoiced"?'<span class="chip info">Invoiced</span>':'<span class="chip">Next invoice</span>';
const howChip=s=>({shopify:'<span class="chip info">Online · Shopify</span>',woocommerce:'<span class="chip info">Online · WooCommerce</span>',script:'<span class="chip info">Online · website</span>',partner:'<span class="chip acc">In person · partner</span>',voucher:'<span class="chip acc">In person · voucher</span>',guest:'<span class="chip acc">In person · guest receipt</span>',admin:'<span class="chip">Added by Hýsa</span>'}[s.source]||"");
const pStatus=p=>p.status==="pending"?'<span class="chip warn">Awaiting approval</span>':p.status==="rejected"?'<span class="chip bad">Rejected</span>':L.agreementActive(p)?'<span class="chip ok">Live</span>':'<span class="chip">Inactive</span>';
const trackChip=p=>{const i=p.integration||{};if(i.type==="shopify"||i.type==="woocommerce")return i.lastError?'<span class="chip bad">Error</span>':(i.token||i.key)?`<span class="chip acc">${L.SYSTEMS[i.type]}</span>`:'<span class="chip warn">Not connected</span>';if(i.type==="script")return p.lastConversionAt?'<span class="chip acc">Tracking code</span>':'<span class="chip warn">Code not seen yet</span>';return '<span class="chip">In person</span>'};
function totals(list){let earned=0,open=0,inv=0,rev=0;for(const s of list){if(!L.billable(s))continue;const c=+s.commission||0;earned+=c;rev+=+s.amount||0;if(s.status==="invoiced")inv+=c;else if(s.status!=="paid")open+=c}return{earned,open,inv,rev}}
const clicks=id=>S.data.clickStats?.[id]||{total:0,last30:0};
function emptyState(t,b,act,btn){return `<div class="empty"><b style="color:var(--fg)">${esc(t)}</b><span>${esc(b)}</span>${act?`<button class="btn sm" data-act="${act}">${esc(btn)}</button>`:""}</div>`}

function vOverview(){
  const sales=SA(),t=totals(sales),partners=P();
  const pend=partners.filter(p=>p.status==="pending"),rev=sales.filter(s=>s.review==="pending");
  const byP={};for(const s of sales.filter(L.billable)){byP[s.partnerId]=byP[s.partnerId]||{c:0,n:0};byP[s.partnerId].c+=+s.commission||0;byP[s.partnerId].n++}
  const rows=partners.filter(p=>p.status==="approved").map(p=>({p,...(byP[p.id]||{c:0,n:0}),k:clicks(p.id)})).sort((a,b)=>b.c-a.c);const max=Math.max(1,...rows.map(r=>r.c));
  const sync=S.data.sync||{};const totalClicks=Object.values(S.data.clickStats||{}).reduce((a,c)=>a+c.last30,0);
  return `
  ${pend.length||rev.length?`<div class="notice warn row spread"><span>${pend.length?`${pend.length} new partner sign-up${pend.length>1?"s":""} to approve. `:""}${rev.length?`${rev.length} guest receipt${rev.length>1?"s":""} to check.`:""}</span><span class="row">${pend.length?'<button class="btn sm" data-tab="partners">Review partners</button>':""}${rev.length?'<button class="btn sm" data-go-review>Check receipts</button>':""}</span></div>`:""}
  <div class="kpis">
    <div class="kpi money"><span class="eyebrow">Commission earned</span><span class="v">${fmt(t.earned)}</span><span class="d">excl. VAT, from ${fmt(t.rev)} in sales</span></div>
    <div class="kpi"><span class="eyebrow">For next invoice</span><span class="v">${fmt(t.open)}</span><span class="d">invoiced automatically on day ${+S.data.settings.invoiceDay||1}</span></div>
    <div class="kpi"><span class="eyebrow">Invoiced, unpaid</span><span class="v">${fmt(t.inv)}</span><span class="d">${IV().filter(i=>i.status!=="paid").length} open invoices</span></div>
    <div class="kpi"><span class="eyebrow">Guests sent</span><span class="v">${totalClicks}</span><span class="d">link clicks, last 30 days</span></div>
  </div>
  <section class="panel"><div class="panel-h"><h3>Links to share</h3></div><div class="panel-b stack" style="gap:10px">
    ${[["Guest guide: send to every guest","/"],["Partner sign-up: send to businesses","/join.html"],["Receipt upload for guests","/receipt.html"]].map(([l,p])=>`<div class="row"><span style="min-width:220px" class="sm">${l}</span><span class="mono" style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(S.data.origin+p)}</span><button class="btn sm" data-copy="${esc(S.data.origin+p)}">Copy</button></div>`).join("")}
  </div></section>
  <div class="grid2">
    <section class="panel"><div class="panel-h"><h3>By partner</h3><span class="sm">${rows.length} live partners</span></div>
      ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Partner</th><th class="num">Clicks 30d</th><th class="num">Sales</th><th style="width:20%"></th><th class="num">Commission</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="click" data-open-partner="${r.p.id}"><td><b>${esc(r.p.name)}</b><div class="sm">${esc(L.agrLabel(r.p))}</div></td><td class="num">${r.k.last30}</td><td class="num">${r.n}</td><td><div class="bar"><i style="width:${(r.c/max*100).toFixed(1)}%"></i></div></td><td class="num"><b>${fmt(r.c,r.p.currency)}</b></td></tr>`).join("")}
      </tbody></table></div>`:emptyState("No live partners yet","Share the partner sign-up link, or add a partner yourself.","new-partner","Add partner")}
    </section>
    <section class="panel"><div class="panel-h"><h3>Automatic checks</h3></div><div class="panel-b stack" style="gap:10px">
      <div class="sm">Last run: <b>${sync.lastRun?new Date(sync.lastRun).toLocaleString("en-GB"):"not run yet"}</b> · every hour. Fetches webshop orders, sends emails and monthly invoices.</div>
      ${(sync.log||[]).length?`<div class="log">${esc((sync.log||[]).slice(0,14).join("\n"))}</div>`:""}
    </div></section>
  </div>
  <section class="panel"><div class="panel-h"><h3>Latest sales</h3><button class="btn sm pri" data-act="new-sale">Add sale</button></div>
    ${sales.length?salesTable([...sales].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,8)):emptyState("No sales yet","Online sales arrive automatically. In-person sales are registered by the partner.")}
  </section>`;
}

function vPartners(){
  const q=S.q.partners.toLowerCase();
  const list=P().filter(p=>!q||[p.name,p.category,p.contactName,p.email].join(" ").toLowerCase().includes(q)).sort((a,b)=>(a.status==="pending"?0:1)-(b.status==="pending"?0:1)||a.name.localeCompare(b.name));
  const earned={};for(const s of SA().filter(L.billable))earned[s.partnerId]=(earned[s.partnerId]||0)+(+s.commission||0);
  return `<div class="row spread"><div><h2>Partners</h2><div class="muted" style="font-size:.9rem">Businesses sign up themselves on the partner page. Approve them here and set the commission.</div></div>
  <div class="row"><input class="search" id="qPartners" placeholder="Search partners" value="${esc(S.q.partners)}"><button class="btn" data-copy="${esc(S.data.origin+"/join.html")}">Copy sign-up link</button><button class="btn pri" data-act="new-partner">Add partner</button></div></div>
  <section class="panel">${list.length?`<div class="tbl-wrap"><table><thead><tr><th>Partner</th><th>Category</th><th>Commission</th><th>Tracking</th><th class="num">Clicks 30d</th><th class="num">Earned</th><th>Status</th></tr></thead><tbody>
  ${list.map(p=>`<tr class="click" data-open-partner="${p.id}"><td><b>${esc(p.name)}</b><div class="sm">${esc(p.email||"")}</div></td><td>${esc(p.category)}</td><td><span class="chip money">${esc(L.agrLabel(p))}</span></td><td>${trackChip(p)}</td><td class="num">${clicks(p.id).last30}</td><td class="num">${fmt(earned[p.id]||0,p.currency)}</td><td>${pStatus(p)}</td></tr>`).join("")}
  </tbody></table></div>`:emptyState(P().length?"No partners match":"No partners yet",P().length?"Try another search.":"Share the sign-up link with local businesses, or add one yourself.","new-partner","Add partner")}</section>`;
}

function salesTable(list){
  return `<div class="tbl-wrap"><table><thead><tr><th>Date</th><th>Partner</th><th>How</th><th>Guest</th><th class="num">Purchase</th><th class="num">Commission</th><th>Status</th></tr></thead><tbody>
  ${list.map(s=>{const p=byId(S.data.partners,s.partnerId);return `<tr class="click" data-open-sale="${s.id}"><td class="mono" style="white-space:nowrap">${fdate(s.date)}</td><td><b>${esc(p?.name||"—")}</b><div class="sm">${esc(s.orderRef?"No. "+s.orderRef:"")}</div></td><td>${howChip(s)}${s.guestReceiptId&&s.source!=="guest"?' <span class="chip ok">Receipt</span>':""}</td><td>${esc(s.guestName||"—")}</td><td class="num">${fmt(s.amount,s.currency)}</td><td class="num"><b style="color:var(--money)">${fmt(s.commission,s.currency)}</b></td><td>${statusChip(s)}</td></tr>`}).join("")}
  </tbody></table></div>`;
}
function vSales(){
  const q=S.q.sales.toLowerCase(),f=S.sf;
  const list=SA().filter(s=>{const p=byId(S.data.partners,s.partnerId);if(f.partner&&s.partnerId!==f.partner)return false;
    if(f.status==="review"&&s.review!=="pending")return false;if(f.status&&f.status!=="review"&&((s.status||"open")!==f.status||s.review==="pending"))return false;
    if(f.how==="online"&&s.method!=="online")return false;if(f.how==="in-store"&&s.method!=="in-store")return false;
    return !q||[p?.name,s.guestName,s.guestEmail,s.orderRef].join(" ").toLowerCase().includes(q)}).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const t=totals(list);
  return `<div class="row spread"><div><h2>Sales</h2><div class="muted" style="font-size:.9rem">Every purchase by a Hýsa guest, per partner. Online orders arrive automatically; in-person purchases are registered by the partner or documented by the guest.</div></div><button class="btn pri" data-act="new-sale">Add sale</button></div>
  <div class="row"><input class="search" id="qSales" placeholder="Search guest, order no…" value="${esc(S.q.sales)}">
  <select id="fPartner" style="max-width:220px"><option value="">All partners</option>${P().map(p=>`<option value="${p.id}" ${f.partner===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select>
  <select id="fHow" style="max-width:160px"><option value="">Online and in person</option><option value="online" ${f.how==="online"?"selected":""}>Online</option><option value="in-store" ${f.how==="in-store"?"selected":""}>In person</option></select>
  <select id="fStatus" style="max-width:180px"><option value="">All statuses</option><option value="review" ${f.status==="review"?"selected":""}>Needs approval</option><option value="open" ${f.status==="open"?"selected":""}>Next invoice</option><option value="invoiced" ${f.status==="invoiced"?"selected":""}>Invoiced</option><option value="paid" ${f.status==="paid"?"selected":""}>Paid</option></select>
  <span class="sm">${list.length} sales · <b class="mono" style="color:var(--money)">${fmt(t.earned)}</b></span>${list.length?'<button class="btn sm" data-act="csv-sales">Download CSV</button>':""}</div>
  <section class="panel">${list.length?salesTable(list):emptyState("No sales here","Try another filter.")}</section>`;
}

function openForInv(){const I=S.inv;return SA().filter(s=>L.billable(s)&&s.partnerId===I.partner&&(!s.status||s.status==="open")&&(!I.from||s.date>=I.from)&&(!I.to||s.date<=I.to))}
function vInvoicing(){
  const st=S.data.settings,I=S.inv,p=byId(S.data.partners,I.partner),open=openForInv(),sum=open.reduce((a,s)=>a+(+s.commission||0),0);
  const openBy={};for(const s of SA())if(L.billable(s)&&(!s.status||s.status==="open"))openBy[s.partnerId]=(openBy[s.partnerId]||0)+(+s.commission||0);
  return `<div><h2>Invoices</h2><div class="muted" style="font-size:.9rem">${st.autoInvoice!==false?`Created automatically on day ${+st.invoiceDay||1} of each month for the previous month, with ${st.vatRate}% VAT and ${st.paymentDays} days payment terms, and emailed as PDF from ${esc(st.invoiceEmail)} to each partner's invoice email.`:"Automatic monthly invoicing is switched off in Settings."}</div></div>
  <div class="grid2">
    <section class="panel"><div class="panel-h"><h3>Invoice now</h3></div><div class="panel-b stack" style="gap:12px">
      <div class="form">
        <label class="f full">Partner<select id="iPartner"><option value="">Choose partner…</option>${P().map(x=>`<option value="${x.id}" ${I.partner===x.id?"selected":""}>${esc(x.name)}${openBy[x.id]?` — ${fmt(openBy[x.id],x.currency)} to bill`:""}</option>`).join("")}</select></label>
        <label class="f">From<input type="date" id="iFrom" value="${esc(I.from)}"></label><label class="f">To<input type="date" id="iTo" value="${esc(I.to)}"></label>
      </div>
      ${p?(open.length?`<div class="calc"><span>${open.length} sales · subtotal ${fmt(sum,p.currency)}</span><span class="mono">Total incl. ${st.vatRate}% VAT ${fmt(sum*(1+(+st.vatRate||0)/100),p.currency)}</span></div>
      <div class="row"><button class="btn pri" data-act="create-invoice">Create &amp; email invoice</button><span class="sm">Sent to ${esc(p.invoiceEmail||p.email||"no email")}</span></div>`:`<div class="muted">Nothing to bill for ${esc(p.name)}.</div>`):`<div class="muted">Choose a partner.</div>`}
    </div></section>
    <section class="panel"><div class="panel-h"><h3>All invoices</h3></div>

/* ---------- events ---------- */
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,a,tr,[data-close-bg]");if(!t)return;
  if(t.matches("[data-close-bg]")&&e.target===t){closeDrawer();return}
  const d=t.dataset;
  if(d.tab){S.tab=d.tab;try{sessionStorage.setItem("hysa-tab",S.tab)}catch(_){}render();return}
  if(t.hasAttribute("data-go-review")){S.tab="sales";S.sf.status="review";render();return}
  if(d.openPartner){partnerDetail(d.openPartner);return}
  if(d.openSale){saleDetail(d.openSale);return}
  if(d.openInvoice){invoiceDetail(d.openInvoice);return}
  if(d.copy){copy(d.copy);return}
  const a=d.act;if(!a)return;
  const confirm2=l=>{if(t.dataset.confirm)return true;t.dataset.confirm=1;t.textContent=l;return false};
  const pa=d.id&&byId(S.data.partners,d.id),sa=d.id&&byId(S.data.sales,d.id),iv=d.id&&byId(S.data.invoices,d.id);
  if(a==="close")closeDrawer();
  else if(a==="reload")load().then(()=>toast("Up to date")).catch(()=>{});
  else if(a==="logout"){await fetch(API+"/api/admin/logout",{credentials:"include"});renderLogin()}
  else if(a==="new-partner")partnerForm();
  else if(a==="edit-partner")partnerForm(pa);
  else if(a==="approve"){Object.assign(touch(pa),{status:"approved",approvedAt:L.nowISO()});pa.agreement.validFrom=pa.agreement.validFrom||L.today();commit();partnerDetail(pa.id);toast("Approved. The partner gets a welcome email within the hour.")}
  else if(a==="reject"){if(confirm2("Click again to reject")){touch(pa).status="rejected";commit();closeDrawer();toast("Rejected")}}
  else if(a==="del-partner"){if(confirm2("Click again to delete")){touch(pa).deleted=true;commit();closeDrawer();toast("Deleted")}}
  else if(a==="new-sale")saleForm({partner:d.partner});
  else if(a==="edit-sale")saleForm({sale:sa});
  else if(a==="approve-sale"){Object.assign(touch(sa),{review:"approved"});commit();saleDetail(sa.id);toast("Approved")}
  else if(a==="reject-sale"){if(confirm2("Click again to reject")){touch(sa).review="rejected";commit();closeDrawer();toast("Rejected")}}
  else if(a==="del-sale"){if(confirm2("Click again to delete")){touch(sa).deleted=true;commit();closeDrawer()}}
  else if(a==="create-invoice"){const p=byId(S.data.partners,S.inv.partner),list=openForInv();if(!p||!list.length)return;
    const v=L.createInvoice({invoices:S.data.invoices,settings:S.data.settings,partner:p,sales:list,from:S.inv.from||undefined,to:S.inv.to||undefined});commit();invoiceDetail(v.id);toast(v.sendRequested?"Created. Emailed within the hour.":"Created. Add an invoice email on the partner to send it.")}
  else if(a==="send-invoice"){const p=byId(S.data.partners,iv.partnerId);const to=p?.invoiceEmail||p?.email;if(!to){toast("Add an invoice email on the partner first");return}Object.assign(touch(iv),{sendRequested:true,sentAt:null,sendError:"",sendTo:to});commit();invoiceDetail(iv.id)}
  else if(a==="mark-paid"||a==="mark-unpaid"){const st=a==="mark-paid"?"paid":"invoiced";Object.assign(touch(iv),{status:st,paidAt:st==="paid"?L.nowISO():null});SA().filter(s=>s.invoiceId===iv.id).forEach(s=>{touch(s).status=st});commit();invoiceDetail(iv.id)}
  else if(a==="del-invoice"){if(confirm2("Click again to cancel")){touch(iv).deleted=true;SA().filter(s=>s.invoiceId===iv.id).forEach(s=>{touch(s).status="open";s.invoiceId=null});commit();closeDrawer()}}
  else if(a==="print")window.print();
  else if(a==="csv-invoice")download(`${iv.number}.csv`,csvFor(SA().filter(s=>s.invoiceId===iv.id)));
  else if(a==="csv-sales")download(`hysa-sales-${L.today()}.csv`,csvFor(SA()));
  else if(a==="backup")download(`hysa-backup-${L.today()}.json`,JSON.stringify(S.data,null,2),"application/json");
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer()});
document.addEventListener("input",e=>{const id=e.target.id;
  if(id==="qPartners"){S.q.partners=e.target.value;render()}else if(id==="qSales"){S.q.sales=e.target.value;render()}
  if(["sPartner","sAmount","sPersons"].includes(id))updCalc()});
document.addEventListener("change",e=>{const id=e.target.id,v=e.target.value;
  if(id==="fPartner"){S.sf.partner=v;render()}else if(id==="fStatus"){S.sf.status=v;render()}else if(id==="fHow"){S.sf.how=v;render()}
  else if(id==="iPartner"){S.inv.partner=v;render()}else if(id==="iFrom"){S.inv.from=v;render()}else if(id==="iTo"){S.inv.to=v;render()}
  else if(id==="pType"){$("#pRateLbl").textContent=v==="percent"?"Commission %":"Amount"}
  else if(id==="iType"){$("#igShopify").hidden=v!=="shopify";$("#igWoo").hidden=v!=="woocommerce"}
  if(id==="sPartner")updCalc()});
document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target;const v=id=>(f.querySelector("#"+id)?.value??"").trim();
  if(f.id==="partnerForm"){
    const old=f.dataset.id?byId(S.data.partners,f.dataset.id):null,ts=L.nowISO();
    const p={...(old||{id:L.uid("p_"),status:"approved",approvedAt:ts,createdAt:ts,active:true}),
      name:v("pName"),category:v("pCat"),currency:v("pCur"),website:v("pWeb"),phone:v("pPhone"),publicEmail:v("pPubMail"),address:v("pAddr"),hours:v("pHours"),description:v("pDesc"),
      discountText:v("pOffer"),discountCode:v("pCode"),contactName:v("pContact"),email:v("pEmail"),invoiceEmail:v("pInvEmail"),companyId:v("pCid"),
      showOnGuide:f.querySelector("#pShow").checked,autoInvoice:f.querySelector("#pAutoInv").checked,
      agreement:{type:v("pType"),rate:+v("pRate")||0,validFrom:v("pFrom")||L.today(),validTo:v("pTo"),notes:v("pNotes")},
      integration:{...(old?.integration||{}),type:v("iType"),shop:v("iShop"),token:v("iTok"),url:v("iUrl"),key:v("iKey"),secret:v("iSec")},updatedAt:ts};
    if(!p.name){toast("Add the business name");return}
    if(!old){p.slug=L.slugify(p.name);let n=2;while(S.data.partners.some(x=>x.slug===p.slug))p.slug=L.slugify(p.name)+"-"+n++;p.trackKey=L.randKey(20);p.portalKey=L.randKey(28);S.data.partners.push(p)}else Object.assign(old,p);
    commit();partnerDetail(p.id);toast("Saved");
  }
  if(f.id==="saleForm"){
    const p=byId(S.data.partners,v("sPartner"));if(!p){toast("Choose a partner");return}
    const amount=+v("sAmount")||0,persons=+v("sPersons")||1,old=f.dataset.id?byId(S.data.sales,f.dataset.id):null,ts=L.nowISO();
    const s={...(old||{id:L.uid("s_"),createdAt:ts,status:"open",review:"approved",source:"admin"}),partnerId:p.id,method:v("sMethod"),date:v("sDate"),amount,persons,orderRef:v("sRef"),
      guestName:v("sGName"),guestEmail:v("sGMail"),guestPhone:v("sGPhone"),currency:p.currency||"DKK",commission:L.commission(p,amount,persons),rateLabel:L.agrLabel(p),updatedAt:ts};
    if(old)Object.assign(old,s);else S.data.sales.push(s);commit();saleDetail(s.id);toast("Saved");
  }
  if(f.id==="setForm"){const st=S.data.settings;Object.assign(st,{company:v("stCompany"),companyId:v("stCid"),address:v("stAddr"),notifyEmail:v("stMail"),defaultRate:+v("stRate")||0,cookieDays:+v("stDays")||30,voucherDays:+v("stVDays")||7,voucherUses:Math.max(0,+v("stVUses")||0),
    invoiceEmail:v("stInvMail"),invoicePrefix:v("stPrefix")||"HYSA-AFF",vatRate:+v("stVat")||0,paymentDays:+v("stPay")||8,invoiceDay:Math.min(28,Math.max(1,+v("stDay")||1)),autoInvoice:f.querySelector("#stAuto").checked,
    bankName:v("stBank"),bankReg:v("stReg"),bankAccount:v("stAcc"),iban:v("stIban"),bic:v("stBic"),id:"main",updatedAt:L.nowISO()});commit();toast("Settings saved")}
});

load().catch(()=>{});
</script>
</body>
