<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Your Hýsa Voucher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<style>.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice .btn{white-space:normal;min-width:0;justify-content:center;text-align:center}.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:6px;align-items:center}.drop img{max-height:200px;border-radius:6px}</style>
</head>
<body>
<div class="wrap" style="max-width:560px">
  <header class="site-h"><a class="mark" href="/" style="text-decoration:none">Hýsa · Guest guide</a><h1 id="h">Your Hýsa voucher</h1><p class="lead" id="lead"></p></header>
  <main id="main" class="stack"><p class="muted">Loading…</p></main>
  <footer class="site"><span>Thank you for helping us support local businesses.</span></footer>
</div>
<script>
const $=s=>document.querySelector(s);const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key=location.hash.slice(1);let D=null,image="";
function done(t){$("#main").innerHTML=`<div class="panel panel-b stack"><h2>Thank you</h2><p class="muted" style="margin:0">${t}</p><a class="btn" href="/">Back to the guide</a></div>`}
async function send(data){const r=await fetch(`/api/confirm/${encodeURIComponent(key)}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Please try again");}
function render(){
  $("#h").textContent=D.partner;$("#lead").textContent=`Did you use your Hýsa voucher ${D.code}${D.offer?` (${D.offer})`:""}?`;
  if(D.answered){done("We have your answer already.");return}
  $("#main").innerHTML=`<div class="choice"><button class="btn pri lg" id="yes">Yes, I bought something</button><button class="btn lg" id="no">No, I did not go</button></div><div id="form"></div>`;
  $("#no").onclick=async()=>{try{await send({visited:false});done("Enjoy the rest of your stay.")}catch(e){alert(e.message)}};
  $("#yes").onclick=()=>{
    $("#form").innerHTML=`<form id="f" class="panel panel-b form" novalidate>
      <label class="f">Amount you paid (DKK)<input id="amt" type="number" step="0.01" min="0" inputmode="decimal" required></label>
      <label class="f">Date<input id="dt" type="date" value="${new Date().toISOString().slice(0,10)}"></label>
      <div class="full"><input id="file" type="file" accept="image/*" hidden><div class="drop" id="drop" role="button" tabindex="0"><b>Add a photo of the receipt</b><span class="sm">Optional, but it helps a lot</span></div></div>
      <div class="full" id="msg"></div><div class="full"><button class="btn pri lg" style="width:100%">Send</button></div></form>`;
    $("#drop").onclick=()=>$("#file").click();
    $("#file").onchange=async()=>{const f=$("#file").files[0];if(!f)return;const img=await createImageBitmap(f).catch(()=>null);if(!img)return;
      const s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      let q=.75;image=c.toDataURL("image/jpeg",q);while(image.length>1_300_000&&q>.3){q-=.15;image=c.toDataURL("image/jpeg",q)}$("#drop").innerHTML=`<img src="${image}" alt="Receipt"><span class="sm">Tap to change</span>`};
    $("#f").onsubmit=async e=>{e.preventDefault();const amt=+$("#amt").value;if(!(amt>0)){$("#msg").innerHTML='<div class="notice bad">Please enter the amount you paid.</div>';return}
      const b=e.target.querySelector("button");b.disabled=true;b.textContent="Sending…";
      try{await send({visited:true,amount:amt,date:$("#dt").value,image});done("Your answer is saved.")}catch(err){$("#msg").innerHTML=`<div class="notice bad">${esc(err.message)}</div>`;b.disabled=false;b.textContent="Send"}};
  };
}
fetch(`/api/confirm/${encodeURIComponent(key)}`).then(r=>r.ok?r.json():Promise.reject()).then(j=>{D=j;render()}).catch(()=>{$("#main").innerHTML='<div class="notice warn">This link is not valid.</div>'});
</script>
</body>
</html>
