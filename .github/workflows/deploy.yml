name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: hysa-partners-v2

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save wrangler@4

      - name: Create the database (first time only) and add its id
        run: |
          find_id() { npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0,"utf8"));const d=l.find(x=>x.name==="hysa-partners");process.stdout.write(d?(d.uuid||d.id):"")'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler d1 create hysa-partners; ID=$(find_id); fi
          echo "Database: $ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml
          npx wrangler d1 execute hysa-partners --remote --file=schema.sql

      - name: Deploy
        run: npx wrangler deploy

      - name: Set passwords
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          JOB_KEY: ${{ secrets.JOB_KEY }}
        run: |
          echo "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          echo "$JOB_KEY" | npx wrangler secret put JOB_KEY
